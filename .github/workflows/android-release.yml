name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run web unit tests
        run: npm test

      - name: Test and build Android APK
        run: .ci-cd/android/build-apk.sh ".ci-cd/artifacts/X-Drive-Arena-${RELEASE_TAG}.apk"

      - name: Generate checksum
        working-directory: .ci-cd/artifacts
        run: sha256sum "X-Drive-Arena-${RELEASE_TAG}.apk" > "X-Drive-Arena-${RELEASE_TAG}.apk.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: X-Drive Arena ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            .ci-cd/artifacts/X-Drive-Arena-${{ env.RELEASE_TAG }}.apk
            .ci-cd/artifacts/X-Drive-Arena-${{ env.RELEASE_TAG }}.apk.sha256
